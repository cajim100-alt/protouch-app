<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#142c3d"><title>プロタッチ調色管理</title><link rel="manifest" href="manifest.webmanifest"><style>:root{font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;color:#182b38;background:#f2f5f7}*{box-sizing:border-box}body{margin:0}header{background:#142c3d;color:white;padding:calc(16px + env(safe-area-inset-top)) 18px 18px}header h1{margin:0;font-size:21px}header small{opacity:.7}main{max-width:680px;margin:auto;padding:14px 14px 90px}.panel{background:white;border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 2px 12px #102c4010}h2{font-size:17px;margin:0 0 12px}label{display:block;font-size:12px;color:#506574;margin-bottom:5px}input,textarea,select{width:100%;border:1px solid #d6e0e7;border-radius:9px;padding:11px;font:inherit;background:#fff;color:#152b39;min-width:0}textarea{min-height:65px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}.row{display:flex;gap:8px;align-items:center}.row>*{min-width:0}.row .grow{flex:1}button{border:0;border-radius:10px;background:#1e647e;color:#fff;padding:11px 13px;font-weight:700;font-size:14px;cursor:pointer}button.secondary{background:#e8eff3;color:#1a5068}button.danger{background:#fce6e5;color:#a22b2b}.seg{display:flex;gap:7px}.seg button{flex:1;background:#e8eff3;color:#21465a}.seg button.active{background:#1e647e;color:#fff}.muted{color:#667d8a;font-size:12px}.mix-head,.mix-row{display:grid;grid-template-columns:1.15fr .82fr .82fr .9fr 32px;gap:5px;align-items:center;margin-bottom:7px}.mix-head{font-size:11px;color:#567080;text-align:center}.mix-row input{padding:9px 4px;text-align:center;font-size:14px}.mix-row .result{text-align:center;font-size:13px;font-weight:700}.mix-row .remove{padding:9px 0;background:#fce6e5;color:#a22b2b}.summary{background:#eaf4f6;padding:13px;border-radius:12px;margin:12px 0}.summary strong{font-size:22px}.notice{font-size:12px;color:#a33b2c}.saved{border-top:1px solid #e5ebef;padding:12px 0}.saved:first-child{border-top:0}.saved b{display:block}.saved .row{margin-top:8px;flex-wrap:wrap}.hidden{display:none}nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #dce4e9;display:flex;padding:8px 8px calc(8px + env(safe-area-inset-bottom));gap:7px}nav button{flex:1;font-size:12px;padding:11px 4px}nav button:not(.active){background:#eef3f6;color:#426071}@media(max-width:370px){.mix-row input{font-size:12px}.mix-head{font-size:10px}}</style></head><body><header><h1>🎨 プロタッチ調色管理</h1><small>調色レシピ・修正記録 / 試作版 0.1</small></header><main><section id="editor"><div class="panel"><h2>車両・カラー情報</h2><div class="fields"><div><label>メーカー</label><input id="maker" placeholder="トヨタ"></div><div><label>車種</label><input id="car" placeholder="プリウス"></div><div><label>カラーコード</label><input id="code" placeholder="070"></div><div><label>色名</label><input id="colorName" placeholder="ホワイトパール"></div></div><div style="margin-top:10px"><label>メモ・キーワード</label><textarea id="memo" placeholder="赤みを調整、ドア補修など"></textarea></div></div><div class="panel"><h2>作成量</h2><div class="seg"><button data-qty="25" class="active">25g</button><button data-qty="50">50g</button><button data-qty="100">100g</button></div><div style="margin-top:10px"><label>任意の作成量 (g)</label><input id="qty" type="number" min="0.01" step="0.01" value="25"></div></div><div class="panel"><h2>配合・修正</h2><p class="muted">標準％を入力 → 実際に追加したgを入力 → 完成％を自動計算</p><div class="mix-head"><span>原色番号</span><span>標準％</span><span>追加g</span><span>完成％</span><span></span></div><div id="mix"></div><button id="addRow" class="secondary">＋ 原色を追加</button><div class="summary"><div class="row" style="justify-content:space-between"><span>完成総量</span><strong id="total">25.00g</strong></div><div class="row" style="justify-content:space-between;margin-top:8px"><span>標準配合合計</span><b id="pctTotal">100.00%</b></div></div><p class="notice" id="warning"></p><div class="row"><button id="save" class="grow">この調色を保存</button><button id="new" class="secondary">新規作成</button></div><p class="muted">保存後は完成％を次回の標準配合として再利用できます。</p></div></section><section id="searchPage" class="hidden"><div class="panel"><h2>保存した調色データ</h2><label>メーカー・車種・カラーコード・色名・メモで検索</label><input id="search" placeholder="例：070、プリウス、赤み"><div id="results"></div></div></section><section id="backupPage" class="hidden"><div class="panel"><h2>バックアップ・復元</h2><p class="muted">保存データはこのブラウザ内に保管されます。Safariのデータ消去や端末故障に備えて、定期的にバックアップしてください。</p><button id="export">JSONバックアップを書き出す</button><div style="margin-top:18px"><label>バックアップファイルを読み込む（既存データに統合）</label><input id="import" type="file" accept="application/json,.json"></div><p id="backupMsg" class="muted"></p></div></section></main><nav><button id="tabEditor" class="active">✏️ 調色入力</button><button id="tabSearch">🔎 検索・再利用</button><button id="tabBackup">💾 バックアップ</button></nav><script>
const $=id=>document.getElementById(id), key='protouch-recipes-v1';let rows=[],editing=null;const uid=()=>crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random();const num=v=>Number(v)||0;const round=v=>Math.round((v+Number.EPSILON)*1e8)/1e8;function load(){try{const v=JSON.parse(localStorage.getItem(key)||'[]');return Array.isArray(v)?v:[]}catch{return []}}let recipes=load();function persist(){localStorage.setItem(key,JSON.stringify(recipes))}function addRow(row={pigment:'',pct:'',add:'0'}){rows.push({...row});renderRows()}function renderRows(){const active=document.activeElement;const focusId=active?.dataset?.field,focusIndex=Number(active?.dataset?.index);$('mix').innerHTML='';rows.forEach((r,i)=>{const el=document.createElement('div');el.className='mix-row';for(const field of ['pigment','pct','add']){const inp=document.createElement('input');inp.dataset.field=field;inp.dataset.index=i;inp.value=r[field]??'';inp.placeholder=field==='pigment'?'番号':field==='pct'?'0':'0';if(field!=='pigment'){inp.type='number';inp.step='any'}inp.addEventListener('input',()=>{rows[i][field]=inp.value;calculate()});el.appendChild(inp)}const result=document.createElement('span');result.className='result';result.id='result-'+i;el.appendChild(result);const del=document.createElement('button');del.className='remove';del.textContent='×';del.setAttribute('aria-label','原色行を削除');del.onclick=()=>{rows.splice(i,1);renderRows()};el.appendChild(del);$('mix').appendChild(el)});calculate();if(focusId&&document.activeElement===document.body){const t=document.querySelector(`[data-index="${focusIndex}"][data-field="${focusId}"]`);t?.focus()}}function calculate(){const qty=num($('qty').value),base=rows.reduce((s,r)=>s+num(r.pct),0),weights=rows.map(r=>qty*num(r.pct)/100+num(r.add)),total=weights.reduce((a,b)=>a+b,0);weights.forEach((w,i)=>{$('result-'+i).textContent=total>0?(100*w/total).toFixed(3)+'%':'—'});$('total').textContent=total.toFixed(2)+'g';$('pctTotal').textContent=base.toFixed(3)+'%';$('pctTotal').style.color=Math.abs(base-100)<.001?'#13744a':'#b3472b';$('warning').textContent=Math.abs(base-100)>.001?'標準配合の合計を100％にしてください。':weights.some(w=>w<0)?'完成量がマイナスの原色があります。':'';return {qty,base,weights,total}}function fields(){return {maker:$('maker').value.trim(),car:$('car').value.trim(),code:$('code').value.trim(),colorName:$('colorName').value.trim(),memo:$('memo').value.trim()}}function setFields(r){for(const k of ['maker','car','code','colorName','memo'])$(k).value=r[k]||''}function clear(){editing=null;setFields({});$('qty').value=25;rows=[{pigment:'',pct:'50',add:'0'},{pigment:'',pct:'30',add:'0'},{pigment:'',pct:'20',add:'0'}];renderRows();updateQty()}function updateQty(){document.querySelectorAll('[data-qty]').forEach(b=>b.classList.toggle('active',num(b.dataset.qty)===num($('qty').value)))}document.querySelectorAll('[data-qty]').forEach(b=>b.onclick=()=>{$('qty').value=b.dataset.qty;updateQty();calculate()});$('qty').oninput=()=>{updateQty();calculate()};$('addRow').onclick=()=>addRow();$('new').onclick=()=>{if(confirm('入力中の内容をクリアしますか？'))clear()};$('save').onclick=()=>{const c=calculate();if(!(c.qty>0)||Math.abs(c.base-100)>.001||c.total<=0||c.weights.some(w=>w<0)||rows.some(r=>!r.pigment.trim()||num(r.pct)<0)){alert('作成量・原色番号・配合率を確認してください。標準％の合計は100％にしてください。');return}const pigments=rows.map((r,i)=>({pigment:r.pigment.trim(),standardPct:num(r.pct),addedG:num(r.add),finishedPct:round(100*c.weights[i]/c.total)}));if(new Set(pigments.map(p=>p.pigment)).size!==pigments.length){alert('同じ原色番号が重複しています。');return}const record={id:editing||uid(),createdAt:editing?(recipes.find(r=>r.id===editing)?.createdAt||new Date().toISOString()):new Date().toISOString(),updatedAt:new Date().toISOString(),...fields(),initialG:c.qty,finishedG:c.total,pigments};if(editing){recipes=recipes.map(r=>r.id===editing?record:r)}else recipes.unshift(record);try{persist()}catch{alert('保存できませんでした。ストレージの空き容量を確認してください。');return}editing=record.id;alert('保存しました！');renderResults()};function show(tab){for(const [name,id] of [['editor','editor'],['search','searchPage'],['backup','backupPage']])$(id).classList.toggle('hidden',name!==tab);for(const [name,id] of [['editor','tabEditor'],['search','tabSearch'],['backup','tabBackup']])$(id).classList.toggle('active',name===tab);if(tab==='search')renderResults();window.scrollTo(0,0)}$('tabEditor').onclick=()=>show('editor');$('tabSearch').onclick=()=>show('search');$('tabBackup').onclick=()=>show('backup');function renderResults(){const q=$('search').value.trim().toLowerCase();$('results').replaceChildren();const found=recipes.filter(r=>[r.maker,r.car,r.code,r.colorName,r.memo].some(s=>(s||'').toLowerCase().includes(q)));if(!found.length){const p=document.createElement('p');p.className='muted';p.textContent='該当データがありません';$('results').appendChild(p)}found.forEach(r=>{const div=document.createElement('div');div.className='saved';const title=document.createElement('b');title.textContent=[r.maker,r.car,r.code].filter(Boolean).join(' / ')||'名称未設定';div.appendChild(title);const sub=document.createElement('p');sub.className='muted';sub.textContent=`${r.colorName||''} ｜ ${new Date(r.updatedAt).toLocaleDateString('ja-JP')} ｜ ${Number(r.finishedG).toFixed(2)}g`;div.appendChild(sub);const details=document.createElement('p');details.className='muted';details.textContent=(r.pigments||[]).map(p=>`${p.pigment}: ${Number(p.finishedPct).toFixed(3)}%`).join(' / ');div.appendChild(details);const actions=document.createElement('div');actions.className='row';function action(name,fn,cls='secondary'){const b=document.createElement('button');b.textContent=name;b.className=cls;b.onclick=fn;actions.appendChild(b)}action('完成％で再作成',()=>{setFields(r);editing=null;rows=r.pigments.map(p=>({pigment:p.pigment,pct:String(p.finishedPct),add:'0'}));const sum=rows.reduce((a,p)=>a+num(p.pct),0);if(rows.length&&Math.abs(sum-100)>.00000001){rows[rows.length-1].pct=String(round(num(rows[rows.length-1].pct)+100-sum))}$('qty').value='25';renderRows();updateQty();show('editor')});action('編集',()=>{editing=r.id;setFields(r);$('qty').value=r.initialG;rows=r.pigments.map(p=>({pigment:p.pigment,pct:String(p.standardPct),add:String(p.addedG)}));renderRows();updateQty();show('editor')});action('削除',()=>{if(confirm('この調色データを削除しますか？')){recipes=recipes.filter(x=>x.id!==r.id);persist();renderResults()}},'danger');div.appendChild(actions);$('results').appendChild(div)})}$('search').oninput=renderResults;$('export').onclick=()=>{const payload={format:'protouch-backup',version:1,exportedAt:new Date().toISOString(),recipes};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='protouch-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),3000);$('backupMsg').textContent='ファイルを保存したら「ファイル」アプリ等で保管してください。'};$('import').onchange=async e=>{const file=e.target.files?.[0];if(!file)return;try{const data=JSON.parse(await file.text());if(data.format!=='protouch-backup'||data.version!==1||!Array.isArray(data.recipes)||!data.recipes.every(r=>r&&typeof r.id==='string'&&Array.isArray(r.pigments)&&r.pigments.every(p=>typeof p.pigment==='string'&&Number.isFinite(p.finishedPct))))throw Error('形式が違います');if(!confirm(`${data.recipes.length}件のバックアップを取り込みますか？ 同じIDのデータはバックアップ側で更新されます。`))return;const map=new Map(recipes.map(r=>[r.id,r]));data.recipes.forEach(r=>map.set(r.id,r));recipes=[...map.values()];persist();$('backupMsg').textContent=`復元しました（合計${recipes.length}件）`;}catch(err){$('backupMsg').textContent='読み込みに失敗しました。正しいバックアップファイルを選んでください。'}finally{e.target.value=''}};clear();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
