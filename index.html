<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#102c42"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><title>えりーと調色 v0.2</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;color:#182e40;background:#f3f6f8}*{box-sizing:border-box}body{margin:0}header{background:#102c42;color:white;padding:22px 16px 18px}header h1{font-size:22px;margin:0 0 5px}header small{color:#c9d9e2}main{max-width:860px;margin:auto;padding:14px 12px 90px}.card{background:white;border-radius:13px;padding:17px;margin-bottom:14px;box-shadow:0 2px 10px #17334a13}h2{font-size:18px;margin:0 0 14px}.hint{font-size:12px;color:#526a7b;line-height:1.6}.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}label{display:block;font-size:12px;font-weight:700;color:#40566a;margin-bottom:5px}input,select{width:100%;border:1px solid #cad5de;border-radius:8px;padding:11px;font-size:16px;background:white;color:#172d3e}button{border:0;border-radius:9px;padding:12px 14px;font-size:14px;font-weight:700;background:#e9f0f5;color:#12334c;cursor:pointer}button.primary{background:#126ba4;color:white}button.good{background:#16805a;color:white}button.danger{background:#fbe8e8;color:#ae2525}button:active{opacity:.75}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.actions button{flex:1}.rowitem{border:1px solid #e0e7ed;border-radius:10px;padding:12px;margin-bottom:10px}.rowgrid{display:grid;grid-template-columns:1.05fr 1fr 1fr;gap:8px}.rowgrid2{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:9px}.num{text-align:right}.result{background:#eef6fb;border-radius:10px;padding:12px;margin-top:12px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:9px}.stat{background:white;border-radius:8px;padding:10px}.stat strong{display:block;font-size:19px;margin-top:5px}.result table{width:100%;border-collapse:collapse;font-size:13px}.result td,.result th{padding:9px 3px;border-bottom:1px solid #d6e5ed;text-align:right}.result td:first-child,.result th:first-child{text-align:left}.warn{color:#a45012}.saved{border-bottom:1px solid #e3e9ee;padding:12px 0}.saved strong{display:block}.saved small{color:#587081}.full{width:100%}@media(max-width:390px){.rowgrid,.rowgrid2{gap:5px}.rowitem{padding:9px}input{padding:9px 5px}.card{padding:13px}.result table{font-size:11px}}
</style></head><body><header><h1>🎨 えりーと調色</h1><small>Ver.0.2｜基準量方式・80% / 120% 配合対応</small></header><main><section class="card"><h2>車両・カラー情報</h2><div class="fields"><div><label>メーカー</label><input id="maker" placeholder="トヨタ"></div><div><label>車種</label><input id="model" placeholder="プリウス"></div><div><label>カラーコード</label><input id="code" placeholder="例：070"></div><div><label>カラー名</label><input id="color" placeholder="ホワイトパール"></div></div><div style="margin-top:12px"><label>メモ</label><input id="memo" placeholder="現車との色差・施工メモ"></div></section><section class="card"><h2>基準量と配合</h2><label>基準量（g）※標準100%に相当する重さ</label><div class="actions" style="margin:0 0 9px"><button type="button" data-base="25">25g</button><button type="button" data-base="50">50g</button><button type="button" data-base="100">100g</button></div><input id="base" class="num" type="number" min="0.01" step="0.01" value="25"><p class="hint">例：基準25g、開始合計80%なら実際の開始重量は20g。100%への強制補正はしません。</p><div id="rows"></div><button id="add" class="full" type="button">＋ 原色を追加</button><div class="result" id="result"></div><div class="actions"><button id="save" class="good" type="button">この調色を保存</button><button id="clear" type="button">新規入力</button></div><p class="hint">「完成・基準％」は100%を超えてもOK。「再作成用％」は完成塗料をゼロから作るときの割合です。</p></section><section class="card"><h2>🔎 保存データの検索・再利用</h2><input id="search" placeholder="メーカー・車種・カラーコード・原色番号"><div id="saved"></div></section><section class="card"><h2>データのバックアップ</h2><p class="hint">データはこのブラウザ内に保存されます。端末変更やサイトデータ削除に備えて、JSONファイルを定期的に書き出してください。Ver.0.1の保存データは変更しません。</p><div class="actions"><button id="export" type="button">バックアップ書き出し</button><button id="importBtn" type="button">バックアップ読み込み</button></div><input id="importFile" type="file" accept=".json,application/json" hidden></section></main><script>
'use strict';const KEY='protouch_v02_records';let records=[];let editId=null;let rows=[];const $=id=>document.getElementById(id);const number=v=>Number(v)||0;const fmt=n=>Number.isFinite(n)?n.toFixed(3):'—';const escapeHTML=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);function read(){try{const a=JSON.parse(localStorage.getItem(KEY)||'[]');records=Array.isArray(a)?a:[]}catch{records=[];alert('保存データを読み込めませんでした。バックアップを確認してください。')}}function persist(){try{localStorage.setItem(KEY,JSON.stringify(records));return true}catch(e){alert('保存に失敗しました。ストレージ容量やブラウザ設定を確認してください。');return false}}
function addRow(r={pigment:'',standard:0,start:0,added:0}){rows.push({...r});drawRows()}function drawRows(){const root=$('rows');root.innerHTML='';rows.forEach((r,i)=>{const el=document.createElement('div');el.className='rowitem';el.innerHTML=`<div class="rowgrid"><div><label>原色番号</label><input data-i="${i}" data-k="pigment" value="${escapeHTML(r.pigment)}" placeholder="010"></div><div><label>標準％</label><input class="num" type="number" step="any" data-i="${i}" data-k="standard" value="${r.standard}"></div><div><label>開始％</label><input class="num" type="number" step="any" data-i="${i}" data-k="start" value="${r.start}"></div></div><div class="rowgrid2"><div><label>開始g</label><input data-out="start" disabled></div><div><label>追加g</label><input class="num" type="number" step="any" data-i="${i}" data-k="added" value="${r.added}"></div><div><label>完成g</label><input data-out="final" disabled></div></div><div class="actions"><button class="danger" type="button" data-del="${i}">この原色を削除</button></div>`;root.append(el)});calc()}function calc(){const base=number($('base').value);let sumStart=0,sumAdded=0,sumFinal=0,sumStd=0;for(let i=0;i<rows.length;i++){const r=rows[i];const g=base*number(r.start)/100;const final=g+number(r.added);sumStd+=number(r.standard);sumStart+=g;sumAdded+=number(r.added);sumFinal+=final;const el=$('rows').children[i];if(el){el.querySelector('[data-out="start"]').value=fmt(g);el.querySelector('[data-out="final"]').value=fmt(final)}}const startPct=base>0?sumStart/base*100:0,finalPct=base>0?sumFinal/base*100:0;let html=`<div class="stats"><div class="stat">開始総量<strong>${fmt(sumStart)}g</strong></div><div class="stat">完成総量<strong>${fmt(sumFinal)}g</strong></div><div class="stat">開始・基準％<strong>${fmt(startPct)}%</strong></div><div class="stat">完成・基準％<strong>${fmt(finalPct)}%</strong></div></div><p class="hint">標準配合合計 ${fmt(sumStd)}% ／ 追加合計 ${fmt(sumAdded)}g</p><div style="overflow-x:auto"><table><thead><tr><th>原色</th><th>完成・基準％</th><th>再作成用％</th></tr></thead><tbody>`;rows.forEach(r=>{const g=base*number(r.start)/100+number(r.added);html+=`<tr><td>${escapeHTML(r.pigment||'未入力')}</td><td>${base>0?fmt(g/base*100):'—'}%</td><td>${sumFinal>0?fmt(g/sumFinal*100):'—'}%</td></tr>`});html+=`</tbody></table></div>`;if(rows.some(r=>base*number(r.start)/100+number(r.added)<-0.000001))html+='<p class="warn">⚠ 完成重量がマイナスの原色があります。</p>';$('result').innerHTML=html;return {base,sumStart,sumFinal}}
$('rows').addEventListener('input',e=>{const t=e.target;if(t.dataset.i===undefined)return;const r=rows[Number(t.dataset.i)];r[t.dataset.k]=t.dataset.k==='pigment'?t.value:number(t.value);calc()});$('rows').addEventListener('click',e=>{const b=e.target.closest('[data-del]');if(!b)return;rows.splice(Number(b.dataset.del),1);drawRows()});$('base').addEventListener('input',calc);document.querySelectorAll('[data-base]').forEach(b=>b.addEventListener('click',()=>{$('base').value=b.dataset.base;calc()}));$('add').addEventListener('click',()=>addRow());function reset(){editId=null;['maker','model','code','color','memo'].forEach(id=>$(id).value='');$('base').value='25';rows=[];addRow();addRow();window.scrollTo({top:0,behavior:'smooth'})}$('clear').addEventListener('click',()=>{if(confirm('入力内容をクリアしますか？ 保存済みデータは消えません。'))reset()});$('save').addEventListener('click',()=>{const {base,sumFinal}=calc();if(base<=0)return alert('基準量は0より大きい数字にしてください。');const valid=rows.filter(r=>String(r.pigment).trim()||number(r.standard)||number(r.start)||number(r.added));if(!valid.length)return alert('原色を1つ以上入力してください。');if(valid.some(r=>!String(r.pigment).trim()))return alert('配合のある行には原色番号を入力してください。');if(valid.some(r=>number(r.standard)<0||number(r.start)<0||number(r.added)<0))return alert('負の数値は使用できません。');if(valid.some(r=>base*number(r.start)/100+number(r.added)<0)||sumFinal<=0)return alert('完成総量が0以下です。');if(new Set(valid.map(r=>String(r.pigment).trim())).size!==valid.length)return alert('同じ原色番号が複数あります。1行にまとめてください。');const now=new Date().toISOString();const rec={id:editId||uid(),updated:now,maker:$('maker').value.trim(),model:$('model').value.trim(),code:$('code').value.trim(),color:$('color').value.trim(),memo:$('memo').value.trim(),base,rows:valid.map(r=>({...r,pigment:String(r.pigment).trim()}))};const old=records.findIndex(x=>x.id===rec.id);if(old>=0)records[old]=rec;else records.unshift(rec);if(persist()){editId=rec.id;renderSaved();alert('保存しました！')}});function load(id){const r=records.find(x=>x.id===id);if(!r)return;editId=r.id;['maker','model','code','color','memo'].forEach(k=>$(k).value=r[k]||'');$('base').value=r.base;rows=(r.rows||[]).map(x=>({...x}));drawRows();window.scrollTo({top:0,behavior:'smooth'})}function renderSaved(){const q=$('search').value.trim().toLowerCase();const list=records.filter(r=>[r.maker,r.model,r.code,r.color,r.memo,...(r.rows||[]).map(x=>x.pigment)].join(' ').toLowerCase().includes(q));$('saved').innerHTML=list.length?'':`<p class="hint">保存データはありません。</p>`;list.forEach(r=>{const el=document.createElement('div');el.className='saved';el.innerHTML=`<strong>${escapeHTML([r.maker,r.model,r.code].filter(Boolean).join(' / ')||'名称未設定')}</strong><small>${escapeHTML(r.color||'')}　基準${r.base}g　${escapeHTML((r.updated||'').slice(0,10))}</small><div class="actions"><button class="primary" data-load="${escapeHTML(r.id)}">呼び出す・編集</button><button class="danger" data-delete="${escapeHTML(r.id)}">削除</button></div>`;$('saved').append(el)})}$('search').addEventListener('input',renderSaved);$('saved').addEventListener('click',e=>{const l=e.target.closest('[data-load]'),d=e.target.closest('[data-delete]');if(l)load(l.dataset.load);if(d&&confirm('この保存データを削除しますか？')){records=records.filter(x=>x.id!==d.dataset.delete);if(editId===d.dataset.delete)editId=null;persist();renderSaved()}});$('export').addEventListener('click',()=>{const blob=new Blob([JSON.stringify({app:'protouch-v02',exported:new Date().toISOString(),records},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='protouch_backup_'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1500)});$('importBtn').addEventListener('click',()=>$('importFile').click());$('importFile').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;try{const data=JSON.parse(await f.text());if(data.app!=='protouch-v02'||!Array.isArray(data.records)||data.records.some(r=>!r.id||!Array.isArray(r.rows)||!(Number(r.base)>0)))throw Error('形式が違います');if(!confirm(`${data.records.length}件のデータを取り込みます。現在のデータに同じIDがあれば上書きします。よろしいですか？`))return;const m=new Map(records.map(r=>[r.id,r]));data.records.forEach(r=>m.set(r.id,r));records=[...m.values()];if(persist()){renderSaved();alert('取り込み完了')}}catch(err){alert('読み込めませんでした：'+err.message)}finally{e.target.value=''}});read();reset();renderSaved();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
